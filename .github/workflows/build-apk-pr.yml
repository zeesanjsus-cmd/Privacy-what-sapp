name: APK Build (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: mobile
        run: flutter create --platforms=android --org com.privacywhatsapp .
      - name: Get packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: privacy-whatsapp-debug-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
