version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: privacy_whatsapp
      POSTGRES_USER: privacy
      POSTGRES_PASSWORD: privacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ./backend
    environment:
      PORT: 8080
      NODE_ENV: production
      JWT_SECRET: change-me
      OTP_PEPPER: change-me-too
      DATABASE_URL: postgresql://privacy:privacy@postgres:5432/privacy_whatsapp
      REDIS_URL: redis://redis:6379
      SMS_PROVIDER: console
      OWNER_PHONE: +920000000000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
