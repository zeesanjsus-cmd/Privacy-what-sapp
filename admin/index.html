<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy WhatsApp Owner Panel</title>
<style>body{margin:0;background:#080808;color:#eee;font:14px Arial}header{background:#151515;padding:18px}h1{color:#e53935;margin:0 0 6px}.wrap{padding:20px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}input,button{padding:11px;border-radius:8px;border:1px solid #333;background:#151515;color:#eee}button{cursor:pointer;background:#e53935;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#151515;padding:16px;border-radius:14px}.danger{color:#ff7777}.muted{color:#aaa}pre{white-space:pre-wrap;max-height:320px;overflow:auto}</style></head>
<body><header><h1>Privacy WhatsApp — Owner/Admin</h1><div class="muted">Reports • Users • Audit Logs</div></header>
<main class="wrap"><div class="bar"><input id="api" placeholder="API URL" value="http://localhost:8080"><input id="token" placeholder="Owner JWT token" style="min-width:280px"><button onclick="loadAll()">Load dashboard</button></div>
<div id="msg" class="muted"></div><div class="grid">
<section class="card"><h2>Revenue & Rewards</h2><div id="revenue">—</div></section>
<section class="card"><h2>Reports</h2><div id="reports">—</div></section>
<section class="card"><h2>Users</h2><div id="users">—</div></section>
<section class="card"><h2>Audit Logs</h2><div id="logs">—</div></section>
</div></main>
<script>
const el=id=>document.getElementById(id);
async function get(path){const r=await fetch(el('api').value.replace(/\/$/,'')+path,{headers:{Authorization:'Bearer '+el('token').value}});if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function action(id,a){try{await fetch(el('api').value+'/owner/users/'+id+'/'+a,{method:'POST',headers:{Authorization:'Bearer '+el('token').value}});await loadAll()}catch(e){el('msg').textContent=e.message}}
async function loadAll(){el('msg').textContent='Loading…';try{const [r,u,l,v]=await Promise.all([get('/owner/reports'),get('/owner/users'),get('/owner/audit-logs'),get('/owner/revenue-summary')]);el('revenue').innerHTML='<b>Revenue:</b> '+esc(v.revenue.total_amount_minor)+' minor units<br><b>Revenue events:</b> '+esc(v.revenue.events)+'<br><b>Paying users:</b> '+esc(v.revenue.paying_users)+'<br><b>Reward points issued:</b> '+esc(v.rewards.points_issued);el('reports').innerHTML='<b>'+r.length+'</b> reports'+(r.length?'<pre>'+esc(JSON.stringify(r,null,2))+'</pre>':'');el('users').innerHTML='<b>'+u.length+'</b> users'+u.slice(0,100).map(x=>'<div style="padding:8px 0;border-bottom:1px solid #292929"><b>'+esc(x.display_name||x.phone)+'</b><br><span class="muted">'+esc(x.status)+'</span> <button onclick="action(\''+esc(x.id)+'\',\'suspend\')">Suspend</button> <button onclick="action(\''+esc(x.id)+'\',\'restore\')">Restore</button></div>').join('');el('logs').innerHTML='<b>'+l.length+'</b> events<pre>'+esc(JSON.stringify(l.slice(0,200),null,2))+'</pre>';el('msg').textContent='Dashboard updated';}catch(e){el('msg').textContent='Error: '+e.message}}
</script></body></html>
